name: simplefy
description: "Folder-first Jellyfin music client."
publish_to: 'none'
version: 0.8.1+25

environment:
  sdk: ^3.12.2

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  background_downloader: ^9.5.9
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/simplefy-icon.png
